name: Publish QRL Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.4.553
          tinytex: true

      # PDF: needs TeX + the fonts used for glyph fallback (see _quarto.yml).
      # Failures here must not block the website, so these steps continue on error.
      - name: Install PDF fonts
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-lmodern fonts-dejavu-core fonts-noto-core fonts-symbola

      # Quarto's on-demand package install misses some (e.g. luatexbase), so
      # install everything the PDF loads up front. One at a time: a bad name
      # only skips that package.
      - name: Install LaTeX packages
        continue-on-error: true
        run: |
          for p in luatexbase luaotfload lualibs ctablestack lualatex-math selnolig \
                   fontspec unicode-math lm koma-script amsmath amsfonts stmaryrd \
                   fontawesome5 fancyvrb fvextra upquote framed float caption booktabs \
                   tcolorbox pgf environ trimspaces tikzfill pdfcol bookmark xurl url \
                   footnotehyper microtype etoolbox epstopdf-pkg xcolor hyperref; do
            tlmgr install "$p" || echo "skipped $p"
          done

      - name: Render PDF
        id: pdf
        continue-on-error: true
        run: |
          quarto render --to pdf
          mkdir -p "$RUNNER_TEMP/pdf"
          cp _book/The-QRL-Book.pdf "$RUNNER_TEMP/pdf/"

      # The HTML render clears _book, so the PDF is copied back afterwards
      - name: Render Quarto book
        run: quarto render --to html

      - name: Add PDF download
        if: steps.pdf.outcome == 'success'
        run: cp "$RUNNER_TEMP/pdf/The-QRL-Book.pdf" _book/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
